services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: culinary_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - culinary_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: culinary_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - culinary_net
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: culinary_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-culinary_db}
      POSTGRES_USER: ${DB_USERNAME:-culinary_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - culinary_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-culinary_user} -d ${DB_DATABASE:-culinary_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: culinary_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - culinary_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  culinary_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: